<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ticket-ops - 自动化作业台</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12161b; --panel2:#171c22; --line:#232a33;
    --txt:#e6ebf1; --dim:#7d8896; --accent:#4ade80; --warn:#fbbf24; --err:#f87171; --info:#60a5fa;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Code",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .pill{font:11px/1 var(--mono);padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--dim);white-space:nowrap}
  .pill.ok{color:var(--accent);border-color:#1f4d34;background:#0d1f16}
  .pill.bad{color:var(--err);border-color:#4d2020;background:#1f0d0d}
  .pill.warn{color:var(--warn);border-color:#4d3d1a;background:#1f1809}
  .spacer{flex:1}

  main{display:grid;grid-template-columns:250px minmax(360px,1fr) minmax(380px,1.15fr);gap:14px;padding:14px 20px 40px;align-items:start}
  @media(max-width:1200px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card>h2{font-size:12px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--dim);font-weight:600;letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .card>h2 b{color:var(--txt);font-weight:600}
  .body{padding:12px 14px}

  /* 设备 */
  .dev{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:9px;background:var(--panel2)}
  .dev .top{display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
  .dot.idle{background:var(--accent)} .dot.busy{background:var(--info);animation:pulse 1s infinite}
  .dot.offline{background:var(--err)} .dot.banned{background:var(--err)}
  @keyframes pulse{50%{opacity:.35}}
  .dev .serial{font:12px/1.3 var(--mono);color:var(--txt);overflow:hidden;text-overflow:ellipsis}
  .dev .meta{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .tag{font:10px/1 var(--mono);padding:3px 6px;border-radius:4px;background:#1c2430;color:var(--info);border:1px solid #24313f}

  /* 任务 */
  .task{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:10px;background:var(--panel2);transition:border-color .2s}
  .task.success{border-color:#1f4d34;background:#0c1712}
  .task.failed{border-color:#4d2020;background:#170d0d}
  .task.armed,.task.running{border-color:#254063;background:#0c1219}
  .task .row1{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
  .task .id{font:11px/1 var(--mono);color:var(--dim)}
  .task .scene{font-weight:600;font-size:13px}
  .status{font:10px/1 var(--mono);padding:4px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px}
  .status.queued{background:#1c2430;color:var(--dim)}
  .status.armed,.status.running{background:#12294a;color:var(--info)}
  .status.success{background:#12301f;color:var(--accent)}
  .status.failed{background:#331515;color:var(--err)}
  .status.cancelled{background:#221c10;color:var(--warn)}
  .task .cd{font:12px/1 var(--mono);color:var(--warn);margin-left:auto}
  .task .detail{font-size:12px;color:var(--dim);word-break:break-all}
  .task .cfg{font:11px/1.5 var(--mono);color:#8b97a6;margin-top:5px}
  .task .devs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

  /* 事件流 */
  #log{height:calc(100vh - 200px);min-height:340px;overflow-y:auto;font:11.5px/1.65 var(--mono);padding:10px 12px}
  #log::-webkit-scrollbar{width:8px} #log::-webkit-scrollbar-thumb{background:#2a323d;border-radius:4px}
  .ev{display:flex;gap:8px;padding:1px 0;border-bottom:1px solid #14181d}
  .ev .t{color:#4b5563;flex:none}
  .ev .d{color:#7c8b9d;flex:none;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .m{color:var(--txt);word-break:break-all}
  .ev.action .m{color:#9fb3c8}
  .ev.result .m{color:var(--accent);font-weight:600}
  .ev.block .m,.ev.action.fail .m{color:var(--err)}
  .ev.note .m{color:var(--warn)}

  /* 表单 */
  label{display:block;font-size:11px;color:var(--dim);margin:9px 0 3px;letter-spacing:.4px}
  input,select{width:100%;background:#0e1216;border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:7px 9px;font:12px/1.4 var(--mono);outline:none}
  input:focus,select:focus{border-color:#2f4a6b}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  button{width:100%;margin-top:14px;padding:9px;border:0;border-radius:7px;background:#1b5e3f;color:#d8ffe9;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
  button:hover{background:#22734d}
  button.ghost{background:#1a2129;color:var(--dim);font-size:12px;margin-top:8px}
  button.ghost:hover{background:#232c36;color:var(--txt)}
  .hint{font-size:11px;color:#5c6673;margin-top:10px;line-height:1.6}
  .empty{color:#4b5563;font-size:12px;text-align:center;padding:22px 0}
</style>
</head>
<body>
<header>
  <h1>ticket-ops<span>自动化作业台</span></h1>
  <div class="pill" id="p-clock">时钟 未校时</div>
  <div class="pill" id="p-dev">设备 0</div>
  <div class="pill" id="p-task">任务 0</div>
  <div class="pill" id="p-win">成功 0</div>
  <div class="spacer"></div>
  <button class="ghost" style="width:auto;margin:0;padding:6px 12px" onclick="syncClock()">重新校时</button>
  <button class="ghost" style="width:auto;margin:0;padding:6px 12px" onclick="scanDevices()">扫描设备</button>
</header>

<main>
  <!-- 设备 -->
  <section class="card">
    <h2>设备池 <b id="dev-count">0</b></h2>
    <div class="body" id="devices"><div class="empty">暂无设备</div></div>
  </section>

  <!-- 任务 -->
  <section class="card">
    <h2>任务 <b id="task-count">0</b></h2>
    <div class="body">
      <div id="tasks"><div class="empty">暂无任务</div></div>

      <details style="margin-top:4px">
        <summary style="cursor:pointer;font-size:12px;color:var(--info);padding:8px 0">+ 新建任务</summary>
        <div class="grid2">
          <div><label>平台</label>
            <select id="f-scene" onchange="syncFields()">
              <option value="damai">大麦</option>
              <option value="maoyan">猫眼</option>
            </select>
          </div>
          <div><label id="l-item">演出 ID</label><input id="f-item" placeholder="716435462268"></div>
          <div><label id="l-sku">票档</label><input id="f-sku" placeholder="看台580"></div>
          <div><label>场次</label><input id="f-session" placeholder="06-01"></div>
          <div><label>数量</label><input id="f-qty" type="number" value="1" min="1" max="6"></div>
          <div><label>观演人（逗号分隔）</label><input id="f-viewers" placeholder="张三"></div>
          <div><label>派几台设备</label><input id="f-rep" type="number" value="1" min="1" max="8"></div>
          <div><label>开售时间</label><input id="f-sale" type="datetime-local" step="1"></div>
          <div><label>提前发射 (ms)</label><input id="f-lead" type="number" value="55"></div>
        </div>
        <label>盲点入口坐标 (x,y)</label><input id="f-xy" placeholder="540,2100">
        <button onclick="createTask()">加入队列</button>
        <div class="hint">开售时间留空 = 20 秒后立刻跑一次（用于演练/调试）。<br>
        盲点坐标务必按自己机型改，错 30px 就点到别的按钮上了。<br>
        <span id="scene-hint">大麦：票档填子串（看台580）。</span></div>
      </details>
    </div>
  </section>

  <!-- 事件流 -->
  <section class="card">
    <h2>实时事件 <b id="ev-count">0</b></h2>
    <div id="log"></div>
  </section>
</main>

<script>
const fmt = n => (n ?? 0).toFixed(0);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let evSeen = new Set();

function renderDevices(devs){
  const box = document.getElementById('devices');
  document.getElementById('dev-count').textContent = devs.length;
  document.getElementById('p-dev').textContent = `设备 ${devs.length}（空闲 ${devs.filter(d=>d.state==='idle').length}）`;
  if(!devs.length){ box.innerHTML = '<div class="empty">暂无设备<br><span style="font-size:11px">插上手机 → 开发者选项 → USB调试 → 点右上「扫描设备」</span></div>'; return; }
  box.innerHTML = devs.map(d=>`
    <div class="dev">
      <div class="top">
        <span class="dot ${esc(d.state)}"></span>
        <span class="serial" title="${esc(d.serial)}">${esc(d.model || d.serial)}</span>
      </div>
      <div class="meta">${esc(d.serial)}${d.android ? ' - Android '+esc(d.android) : ''}</div>
      <div class="meta">${d.account ? '账号 '+esc(d.account) : '未标账号'}${d.busy_task ? ' - 跑 '+esc(d.busy_task) : ''}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:3px">${(d.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>`).join('');
}

function renderTasks(tasks){
  const box = document.getElementById('tasks');
  document.getElementById('task-count').textContent = tasks.length;
  document.getElementById('p-task').textContent = `任务 ${tasks.length}`;
  if(!tasks.length){ box.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  box.innerHTML = tasks.map(t=>{
    const cfg = t.config || {};
    const cd = t.status === 'queued' || t.status === 'armed' || t.status === 'running'
      ? `<span class="cd">${(t.countdown_ms/1000).toFixed(t.countdown_ms>60000?0:2)}s</span>` : '';
    const bits = [];
    if(cfg.item_id) bits.push('item='+cfg.item_id);
    if(cfg.sku) bits.push('票档='+cfg.sku);
    if(cfg.session) bits.push('场次='+cfg.session);
    if(cfg.qty) bits.push('×'+cfg.qty);
    if(cfg.viewers && cfg.viewers.length) bits.push('观演人='+cfg.viewers.join('/'));
    return `<div class="task ${esc(t.status)}">
      <div class="row1">
        <span class="id">${esc(t.id)}</span>
        <span class="scene">${esc(t.scene)}</span>
        <span class="status ${esc(t.status)}">${esc(t.status)}</span>
        ${cd}
      </div>
      <div class="cfg">${esc(bits.join('  '))}</div>
      ${t.detail ? `<div class="detail">${esc(t.detail)}</div>` : ''}
      <div class="devs">${(t.devices||[]).map(d=>`<span class="tag">${esc(d)}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

function renderEvents(evs){
  const log = document.getElementById('log');
  let added = 0;
  for(const e of evs){
    if(evSeen.has(e.id)) continue;
    evSeen.add(e.id); added++;
    const d = new Date(e.ts*1000);
    const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0'),
          ss = String(d.getSeconds()).padStart(2,'0'), ms = String(d.getMilliseconds()).padStart(3,'0');
    const cls = e.kind + (e.ok ? '' : ' fail');
    const msg = [e.state && `[${e.state}]`, e.action, e.detail].filter(Boolean).join(' ');
    const el = document.createElement('div');
    el.className = 'ev ' + cls;
    el.innerHTML = `<span class="t">${hh}:${mm}:${ss}.${ms}</span>
                    <span class="d">${esc(e.device||'—')}</span>
                    <span class="m">${esc(msg)}</span>`;
    log.appendChild(el);
  }
  if(added){ log.scrollTop = log.scrollHeight; }
  document.getElementById('ev-count').textContent = evSeen.size;
  while(log.childElementCount > 900) log.removeChild(log.firstChild);
}

function renderClock(c, stats){
  const p = document.getElementById('p-clock');
  if(!c.calibrated){ p.className='pill bad'; p.textContent='时钟 未校时'; }
  else{
    const ok = Math.abs(c.offset_ms) < 200 && (c.spread_ms ?? 99) <= 60;
    p.className = 'pill ' + (ok ? 'ok' : 'warn');
    p.textContent = `时钟 ${c.offset_ms>0?'+':''}${c.offset_ms}ms / 抖动 ${c.spread_ms}ms`;
  }
  const wins = (stats.results && (stats.results.success||0)) || 0;
  const pw = document.getElementById('p-win');
  pw.className = 'pill ' + (wins>0?'ok':'');
  pw.textContent = `成功 ${wins}`;
}

const es = new EventSource('/api/stream');
let firstState = true;
es.onmessage = ev => {
  const data = JSON.parse(ev.data);
  renderClock(data.state.clock, data.state.stats);
  renderDevices(data.state.devices);
  renderTasks(data.state.tasks);
  for(const e of (data.events||[]).reverse()) {
    // 事件按时间正序展示
  }
  renderEvents(data.events||[]);
  if(firstState){ firstState = false; document.getElementById('ev-count').textContent = evSeen.size; }
};
es.onerror = () => { document.getElementById('p-clock').className='pill bad';
                     document.getElementById('p-clock').textContent='时钟 连接断开'; };

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
  return r.json();
}
// 每个平台的 config 字段名不一样，这里做一次翻译，别让后端的 scene 概念漏到表单上。
const SCENE_FIELDS = {
  damai:  { item: ['演出 ID', '716435462268'], sku: ['票档（子串匹配）', '看台580'],
            hint: '大麦：票档填子串（看台580）；item_id 是详情页链接里的数字。' },
  maoyan: { item: ['演出（仅日志用）', '巡回演唱会 上海站'], sku: ['目标票价（整数）', '580'],
            hint: '猫眼：票档填整数票价（580）；缺货的档会自动跳过，可退到就近价。' },
};
function syncFields(){
  const f = SCENE_FIELDS[val('f-scene')] || SCENE_FIELDS.damai;
  document.getElementById('l-item').textContent = f.item[0];
  document.getElementById('f-item').placeholder  = f.item[1];
  document.getElementById('l-sku').textContent  = f.sku[0];
  document.getElementById('f-sku').placeholder   = f.sku[1];
  document.getElementById('scene-hint').textContent = f.hint;
}
async function createTask(){
  const scene = val('f-scene') || 'damai';
  const viewers = val('f-viewers') ? val('f-viewers').split(/[,，\/]/).map(s=>s.trim()).filter(Boolean) : [];
  const qty = parseInt(val('f-qty')||'1',10);
  let cfg;
  if(scene === 'maoyan'){
    cfg = { '演出': val('f-item'), session: val('f-session'),
            price: parseInt(val('f-sku')||'0',10) || 0, qty, viewers };
  } else {
    cfg = { item_id: val('f-item'), sku: val('f-sku'), session: val('f-session'), qty, viewers };
  }
  const xy = val('f-xy');
  if(xy){ const p = xy.split(',').map(s=>parseInt(s.trim(),10)); if(p.length===2 && !p.some(isNaN)) cfg.entry_xy = p; }
  let sale_at = Date.now()/1000 + 20;
  const saleStr = val('f-sale');
  if(saleStr){ sale_at = new Date(saleStr).getTime()/1000; }
  const res = await post('/api/task', {
    scene, config:cfg, sale_at,
    lead_ms: parseFloat(val('f-lead')||'55'),
    replicas: parseInt(val('f-rep')||'1',10),
  });
  if(res.error) alert('失败: '+res.error);
}
syncFields();
async function scanDevices(){ await fetch('/api/devices'); }
async function syncClock(){ const r = await post('/api/clock/sync'); alert(`校时完成 offset=${r.offset_ms.toFixed(1)}ms 抖动=${r.spread_ms.toFixed(1)}ms 成功${r.ok}/失败${r.failed}`); }
function val(id){ return document.getElementById(id).value.trim(); }

// datetime-local 默认给个 60 秒后的时间，方便演练
const d = new Date(Date.now() + 60000);
d.setSeconds(d.getSeconds(), 0);
document.getElementById('f-sale').value = d.toISOString().slice(0,19);
</script>
</body>
</html>
